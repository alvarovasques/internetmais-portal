version: "3.8"

# Stack da Internet Mais para Docker Swarm com Traefik na rede di4e.
# Subir com:  docker stack deploy -c docker-compose.yml internetmais
# As variáveis sensíveis vêm de secrets do Swarm, não do ambiente.

services:
  app:
    image: ghcr.io/alvarovasques/internetmais-portal:latest
    environment:
      NODE_ENV: production
      PORT: "3000"
      SITE_URL: https://internetmais.net
      DATABASE_URL: postgres://internetmais:${POSTGRES_PASSWORD}@postgres:5432/internetmais
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_ISSUER: Internet Mais
      IXC_HOST: ${IXC_HOST}
      IXC_TOKEN: ${IXC_TOKEN}
      IXC_TLS_INSEGURO: ${IXC_TLS_INSEGURO:-false}
      IXC_ID_FILIAL: ${IXC_ID_FILIAL}
      IXC_ID_ASSUNTO_INSTALACAO: ${IXC_ID_ASSUNTO_INSTALACAO}
      IXC_SETOR_INSTALACAO: ${IXC_SETOR_INSTALACAO}
      IXC_TABELA_ARQUIVOS_CLIENTE: ${IXC_TABELA_ARQUIVOS_CLIENTE}
    networks:
      - di4e
      - interna
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=di4e"
        - "traefik.http.services.internetmais.loadbalancer.server.port=3000"

        # HTTPS no domínio
        - "traefik.http.routers.internetmais.rule=Host(`internetmais.net`)"
        - "traefik.http.routers.internetmais.entrypoints=websecure"
        - "traefik.http.routers.internetmais.tls=true"
        - "traefik.http.routers.internetmais.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.internetmais.service=internetmais"

        # HTTP redireciona para HTTPS
        - "traefik.http.middlewares.internetmais-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.internetmais-redirect.redirectscheme.permanent=true"
        - "traefik.http.routers.internetmais-http.rule=Host(`internetmais.net`)"
        - "traefik.http.routers.internetmais-http.entrypoints=web"
        - "traefik.http.routers.internetmais-http.middlewares=internetmais-redirect"
        - "traefik.http.routers.internetmais-http.service=internetmais"

        # www redireciona para o domínio sem www
        - "traefik.http.middlewares.internetmais-www.redirectregex.regex=^https?://www\\.internetmais\\.net(.*)"
        - "traefik.http.middlewares.internetmais-www.redirectregex.replacement=https://internetmais.net$${1}"
        - "traefik.http.middlewares.internetmais-www.redirectregex.permanent=true"
        - "traefik.http.routers.internetmais-www.rule=Host(`www.internetmais.net`)"
        - "traefik.http.routers.internetmais-www.entrypoints=websecure"
        - "traefik.http.routers.internetmais-www.tls=true"
        - "traefik.http.routers.internetmais-www.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.internetmais-www.middlewares=internetmais-www"
        - "traefik.http.routers.internetmais-www.service=internetmais"
        - "traefik.http.routers.internetmais-www-http.rule=Host(`www.internetmais.net`)"
        - "traefik.http.routers.internetmais-www-http.entrypoints=web"
        - "traefik.http.routers.internetmais-www-http.middlewares=internetmais-www"
        - "traefik.http.routers.internetmais-www-http.service=internetmais"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: internetmais
      POSTGRES_USER: internetmais
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Locale pt_BR para ordenação correta de nomes com acento
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internetmais -d internetmais"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      # Banco com volume local não pode ter réplica nem migrar de nó.
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # Dump diário para o volume de backup. Restauração é manual e proposital.
  backup:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_backup:/backup
    networks:
      - interna
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          arquivo="/backup/internetmais-$$(date +%Y%m%d-%H%M).sql.gz"
          pg_dump -h postgres -U internetmais internetmais | gzip > "$$arquivo" \
            && echo "backup gerado: $$arquivo" \
            || echo "FALHA no backup"
          find /backup -name '*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      - postgres
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  di4e:
    external: true
  interna:
    driver: overlay
    attachable: false

volumes:
  postgres_dados:
  postgres_backup:
